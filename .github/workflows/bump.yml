name: Bump formula

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-15
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Sanity style check
        run: brew style Formula/mongo-tui.rb

      - name: Bump formula if a new release exists
        run: .github/scripts/bump-formula.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT вместо GITHUB_TOKEN для gh: встроенный токен не может
          # создавать PR, а PR от PAT ещё и запускает CI (pull_request).
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          BRANCH: master
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
